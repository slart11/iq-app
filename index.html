<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IQ-app</title>
  <meta name="description" content="Velg mellom hoderegning og kartquiz om Trøndelag.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #f8fafc;
      color: #0f172a;
      font: 1rem/1.5 system-ui, sans-serif;
      padding: 1.5rem;
    }
    main { width: min(100%, 48rem); }
    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      letter-spacing: -.065em;
      line-height: 1.05;
    }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .tile {
      display: grid;
      grid-template-columns: 1fr auto;
      align-content: space-between;
      min-height: 13rem;
      gap: 1rem;
      padding: 1.5rem;
      border-radius: 1.25rem;
      color: #fff;
      text-decoration: none;
      transition: background-color .15s ease;
    }
    .math { background: #115e59; }
    .math:hover { background: #134e4a; }
    .geo { background: #1e40af; }
    .geo:hover { background: #1e3a8a; }
    .tile:focus-visible { outline: 3px solid #0f172a; outline-offset: 4px; }
    .icon { font-size: 2rem; line-height: 1; }
    .arrow { font-size: 1.5rem; line-height: 1; }
    .copy { grid-column: 1 / -1; }
    strong { display: block; font-size: 1.75rem; letter-spacing: -.035em; }
    .description { display: block; }
    @media (max-width: 36rem) {
      nav { grid-template-columns: 1fr; }
      .tile { min-height: 10rem; }
    }
    @media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>IQ-app</h1>
    <nav aria-label="Velg fag">
      <a class="tile math" href="./matte.html">
        <span class="icon" aria-hidden="true">±</span>
        <span class="arrow" aria-hidden="true">↗</span>
        <span class="copy"><strong>Matte</strong><span class="description">Øv på hoderegning.</span></span>
      </a>
      <a class="tile geo" href="./geografi.html">
        <span class="icon" aria-hidden="true">◎</span>
        <span class="arrow" aria-hidden="true">↗</span>
        <span class="copy"><strong>Geografi</strong><span class="description">Finn kommunene i Trøndelag på kartet.</span></span>
      </a>
    </nav>
  </main>
</body>
</html>
