<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IQ-app</title>
  <meta name="description" content="Velg mellom hoderegning med pingvin- og isbjørnutfordringen eller kartquiz om Trøndelags 38 kommuner.">
  <link rel="stylesheet" href="./styles/shared.css">
  <style>
    body {
      display: grid;
      place-items: center;
      padding: clamp(1rem, 3.5vw, 2.25rem);
      background:
        radial-gradient(circle at 20% 10%, #e0f2fe 0%, transparent 45%),
        radial-gradient(circle at 85% 90%, #dcfce7 0%, transparent 45%),
        #f1f5f9;
    }

    main {
      width: min(100%, 46rem);
    }

    .home-card {
      background: var(--surface);
      border: 3px solid #141020;
      border-radius: 10px;
      box-shadow: 0 7px 0 #141020;
      padding: clamp(1.5rem, 4vw, 2.25rem) clamp(1.25rem, 3.5vw, 2rem);
    }

    .hero {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: clamp(2.25rem, 6vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: #141020;
    }

    .lead {
      margin: 0;
      font-size: clamp(0.95rem, 2.2vw, 1.05rem);
      font-weight: 600;
      color: var(--ink-muted);
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.125rem;
    }

    .subject-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.25rem;
      min-height: 12.25rem;
      padding: 1.375rem 1.25rem;
      border-radius: 8px;
      border: 3px solid #141020;
      text-align: left;
      text-decoration: none;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      transition: transform 0.06s steps(2), box-shadow 0.06s steps(2), background-color 0.1s ease;
    }

    .subject-btn:focus-visible {
      outline: 3px solid #141020;
      outline-offset: 4px;
    }

    .subject-btn-math {
      background: #0d9488;
      box-shadow: inset 0 5px 0 #5eead4, inset 0 -6px 0 #0f766e, 0 6px 0 #141020;
    }

    .subject-btn-math:hover {
      background: #0f766e;
      transform: translateY(-2px);
      box-shadow: inset 0 5px 0 #5eead4, inset 0 -6px 0 #115e59, 0 8px 0 #141020;
    }

    .subject-btn-math:active {
      transform: translateY(4px);
      box-shadow: inset 0 2px 0 #5eead4, 0 2px 0 #141020;
    }

    .subject-btn-geo {
      background: #2563eb;
      box-shadow: inset 0 5px 0 #93c5fd, inset 0 -6px 0 #1d4ed8, 0 6px 0 #141020;
    }

    .subject-btn-geo:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: inset 0 5px 0 #93c5fd, inset 0 -6px 0 #1e40af, 0 8px 0 #141020;
    }

    .subject-btn-geo:active {
      transform: translateY(4px);
      box-shadow: inset 0 2px 0 #93c5fd, 0 2px 0 #141020;
    }

    .btn-top {
      display: flex;
      align-items: flex-start;
      gap: 0.9rem;
    }

    /* Crisp 2x2 operator key badge for Matte */
    .math-mini-keys {
      display: inline-grid;
      grid-template-columns: repeat(2, 26px);
      gap: 4px;
      flex-shrink: 0;
    }

    .math-mini-key {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      border: 2px solid #141020;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 2px;
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.4), 0 2px 0 #141020;
    }

    .mk-g { background: #16a34a; color: #ffffff; }
    .mk-y { background: #facc15; color: #141020; }
    .mk-b { background: #38bdf8; color: #ffffff; }
    .mk-r { background: #e11d48; color: #ffffff; }

    /* Warm golden 16-bit map badge for Geografi (no sterile white box) */
    .geo-badge-box {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      border: 3px solid #141020;
      background: #facc15;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 3px 0 #fef08a, inset 0 -4px 0 #ca8a04, 0 3px 0 #141020;
      flex-shrink: 0;
    }

    .btn-copy {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .btn-title {
      display: block;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.1;
      text-shadow: 2px 2px 0 #141020;
    }

    .btn-desc {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.94);
    }

    .btn-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-top: 0.75rem;
      border-top: 2px solid rgba(255, 255, 255, 0.25);
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.24rem 0.6rem;
      border-radius: 5px;
      background: rgba(20, 16, 32, 0.34);
      border: 2px solid rgba(20, 16, 32, 0.45);
      font-size: 0.8rem;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    .stat-pill-crown {
      width: 17px;
      height: 13px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .play-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.92rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 1px 2px 0 #141020;
      margin-left: auto;
    }

    @media (max-width: 38rem) {
      .subject-grid {
        grid-template-columns: 1fr;
      }

      .subject-btn {
        min-height: 10.5rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="home-card">
      <header class="hero">
        <h1>IQ-app</h1>
        <p class="lead">Velg fag for å trene hoderegning eller utforske Trøndelag på kartet.</p>
      </header>

      <nav class="subject-grid" aria-label="Velg fag">
        <a class="subject-btn subject-btn-math" href="./matte.html">
          <span class="btn-top">
            <span class="math-mini-keys" aria-hidden="true">
              <span class="math-mini-key mk-g">+</span>
              <span class="math-mini-key mk-y">−</span>
              <span class="math-mini-key mk-b">×</span>
              <span class="math-mini-key mk-r">÷</span>
            </span>
            <span class="btn-copy">
              <strong class="btn-title">Matte</strong>
              <span class="btn-desc">Hoderegning på tid — redd de 10 pingvinene fra isbjørnen!</span>
            </span>
          </span>
          <span class="btn-footer">
            <span class="stat-pill" id="math-best-badge">10 oppgaver</span>
            <span class="play-tag">Start →</span>
          </span>
        </a>

        <a class="subject-btn subject-btn-geo" href="./geografi.html">
          <span class="btn-top">
            <span class="geo-badge-box" aria-hidden="true">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                <path d="M3 6.5L9 4L15 6.5L21 4V17.5L15 20L9 17.5L3 20V6.5Z" fill="#4ade80" stroke="#141020" stroke-width="2.3" stroke-linejoin="round"/>
                <path d="M9 4L15 6.5V20L9 17.5V4Z" fill="#38bdf8" stroke="#141020" stroke-width="2.1" stroke-linejoin="round"/>
                <circle cx="15.5" cy="11" r="2.6" fill="#e11d48" stroke="#141020" stroke-width="1.8"/>
              </svg>
            </span>
            <span class="btn-copy">
              <strong class="btn-title">Geografi</strong>
              <span class="btn-desc">Finn alle 38 kommuner i Trøndelag på det interaktive kartet.</span>
            </span>
          </span>
          <span class="btn-footer">
            <span class="stat-pill" id="geo-best-badge">38 kommuner</span>
            <span class="play-tag">Start →</span>
          </span>
        </a>
      </nav>
    </div>
  </main>

  <script type="module">
    import {
      STORAGE_KEYS,
      loadJson,
      sanitizeMathAttempts,
      sanitizeGeoHistory
    } from "./js/storage.js";

    function pickBestEntry(entries) {
      return entries.reduce((best, entry) => {
        if (!best) return entry;
        const bestRatio = best.score / best.total;
        const entryRatio = entry.score / entry.total;
        if (entryRatio > bestRatio) return entry;
        if (entryRatio === bestRatio && entry.score > best.score) return entry;
        return best;
      }, null);
    }

    const mathAttempts = sanitizeMathAttempts(
      loadJson(STORAGE_KEYS.MATH_ATTEMPTS, [], Array.isArray)
    );
    const mathBadge = document.getElementById("math-best-badge");
    if (mathBadge && mathAttempts.length > 0) {
      const best = pickBestEntry(mathAttempts);
      const countLabel = mathAttempts.length === 1 ? "1 runde" : `${mathAttempts.length} runder`;
      mathBadge.replaceChildren();
      if (best.score === best.total && best.total > 0) {
        const crown = document.createElement("img");
        crown.src = "./assets/crown-10-10.png";
        crown.alt = "";
        crown.className = "stat-pill-crown";
        mathBadge.appendChild(crown);
      }
      mathBadge.appendChild(document.createTextNode(`Beste: ${best.score}/${best.total} · ${countLabel}`));
    }

    const geoHistory = sanitizeGeoHistory(
      loadJson(STORAGE_KEYS.GEO_HISTORY, [], Array.isArray)
    );
    const geoBadge = document.getElementById("geo-best-badge");
    if (geoBadge && geoHistory.length > 0) {
      const best = pickBestEntry(geoHistory);
      geoBadge.textContent = `Beste: ${best.score}/${best.total} · ${geoHistory.length} spill`;
    }
  </script>
</body>
</html>
